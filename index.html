<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>گپ خصوصی</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/vazirmatn@33.0.4/Vazirmatn-font-face.css">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Vazirmatn', sans-serif;
            background: #0f172a;
            color: #f1f5f9;
            height: 100vh;
            overflow: hidden;
        }
        #loginOverlay {
            position: fixed; inset: 0; z-index: 1000;
            display: flex; justify-content: center; align-items: center;
            background: rgba(15,23,42,0.96); backdrop-filter: blur(20px);
            padding: 20px;
        }
        .loginCard {
            background: #1e293b; border-radius: 28px; padding: 36px 28px;
            max-width: 400px; width: 100%; border: 1px solid #2d3a4a;
            text-align: center; box-shadow: 0 30px 80px rgba(0,0,0,0.6);
        }
        .loginCard .logo { font-size: 3rem; margin-bottom: 10px; }
        .loginCard h1 { color: #25D366; font-size: 1.8rem; font-weight: 800; }
        .loginCard .sub { color: #94a3b8; font-size: 0.85rem; margin: 6px 0 20px; }
        .loginCard input {
            width: 100%; padding: 14px 16px; border-radius: 14px;
            border: 1px solid #334155; background: #0f172a; color: #f1f5f9;
            font-size: 1rem; font-family: inherit; margin-bottom: 12px;
            text-align: center; outline: none; transition: 0.2s;
        }
        .loginCard input:focus { border-color: #25D366; box-shadow: 0 0 0 3px rgba(37,211,102,0.15); }
        .loginCard .btn-primary {
            width: 100%; padding: 14px;
            background: #25D366; color: #fff; border: none;
            border-radius: 50px; font-size: 1rem; font-weight: 800;
            cursor: pointer; transition: 0.15s; font-family: inherit;
            box-shadow: 0 6px 20px rgba(37,211,102,0.3);
        }
        .loginCard .btn-primary:active { transform: scale(0.96); }
        .loginCard .saved-user { color: #94a3b8; font-size: 0.85rem; margin: 12px 0; }
        .loginCard .saved-user strong { color: #25D366; }
        .loginCard .logout-btn {
            background: transparent; border: 1px solid #ef4444; color: #ef4444;
            padding: 6px 16px; border-radius: 30px; font-size: 0.8rem;
            cursor: pointer; font-family: inherit; margin-top: 6px; display: none;
        }
        .loginCard .logout-btn:hover { background: #ef4444; color: #fff; }
        #chatContainer {
            display: none; height: 100vh; flex-direction: column;
            padding-bottom: env(safe-area-inset-bottom);
        }
        #header {
            background: #1e293b; padding: 14px 18px;
            border-bottom: 1px solid #2d3a4a;
            display: flex; justify-content: space-between; align-items: center;
            flex-wrap: wrap; gap: 6px;
            padding-top: max(14px, env(safe-area-inset-top));
        }
        #header .room-code { color: #25D366; font-size: 0.9rem; font-weight: 700; }
        #header .user-name { color: #94a3b8; font-size: 0.8rem; }
        #header .logout-btn {
            background: transparent; border: 1px solid #ef4444; color: #ef4444;
            padding: 4px 12px; border-radius: 20px; font-size: 0.7rem;
            cursor: pointer; font-family: inherit;
        }
        #messages {
            flex: 1; overflow-y: auto; padding: 16px 16px 20px;
            display: flex; flex-direction: column; gap: 8px;
            background: #0f172a;
            padding-bottom: 20px;
        }
        .msg {
            max-width: 78%; padding: 10px 14px; border-radius: 18px;
            word-wrap: break-word; font-size: 0.9rem; line-height: 1.6;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
            position: relative;
        }
        .msg.me {
            align-self: flex-end;
            background: #25D366; color: #fff;
            border-bottom-right-radius: 4px;
        }
        .msg.other {
            align-self: flex-start;
            background: #1e293b; border: 1px solid #2d3a4a;
            border-bottom-left-radius: 4px;
        }
        .msg .sender {
            font-size: 0.7rem; font-weight: 600;
            color: #94a3b8; margin-bottom: 2px;
        }
        .msg.me .sender { color: #d1fae5; }
        .msg .time {
            font-size: 0.6rem; color: #64748b;
            margin-top: 4px; text-align: left;
        }
        .msg.me .time { color: #d1fae5; opacity: 0.8; }
        .msg .reactions {
            display: flex; gap: 4px; margin-top: 4px; flex-wrap: wrap;
        }
        .msg .reactions span {
            background: #2d3a4a; padding: 2px 6px; border-radius: 12px;
            font-size: 0.7rem; cursor: pointer; transition: 0.1s;
        }
        .msg .reactions span:hover { transform: scale(1.1); }
        .msg .reply-to {
            font-size: 0.7rem; color: #94a3b8; margin-bottom: 4px;
            padding: 4px 8px; background: rgba(255,255,255,0.05);
            border-radius: 8px; border-right: 2px solid #25D366;
        }
        .msg .edit-indicator {
            font-size: 0.6rem; color: #94a3b8; margin-right: 4px;
        }
        .msg .delete-for-all {
            font-size: 0.6rem; color: #ef4444; cursor: pointer;
            margin-right: 8px;
        }
        .msg .actions {
            display: flex; gap: 6px; margin-top: 4px; flex-wrap: wrap;
        }
        .msg .actions button {
            background: transparent; border: none;
            color: #94a3b8; font-size: 0.6rem; cursor: pointer;
            padding: 2px 6px; border-radius: 4px;
        }
        .msg .actions button:hover { background: #2d3a4a; }
        #inputArea {
            display: flex; gap: 10px; flex-wrap: wrap;
            padding: 12px 16px 20px;
            background: #1e293b;
            border-top: 1px solid #2d3a4a;
            padding-bottom: max(24px, env(safe-area-inset-bottom));
        }
        #inputArea .input-wrapper {
            flex: 1; display: flex; gap: 10px; min-width: 200px;
        }
        #inputArea input {
            flex: 1; padding: 12px 18px; border-radius: 50px;
            border: 1px solid #334155; background: #0f172a; color: #f1f5f9;
            font-size: 0.95rem; font-family: inherit; outline: none;
        }
        #inputArea input:focus { border-color: #25D366; }
        #inputArea .btn-group {
            display: flex; gap: 8px;
        }
        #inputArea button {
            padding: 12px 18px; border-radius: 50px;
            background: #25D366; color: #fff; border: none;
            font-weight: 800; cursor: pointer; font-family: inherit;
            transition: 0.15s; white-space: nowrap;
        }
        #inputArea button:active { transform: scale(0.94); }
        #inputArea .btn-secondary {
            background: #334155; color: #fff;
        }
        .toast {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            background: #1e293b; color: #25D366; padding: 10px 22px;
            border-radius: 30px; font-size: 0.8rem; z-index: 999;
            display: none; border: 1px solid #25D366; backdrop-filter: blur(8px);
            text-align: center; box-shadow: 0 8px 30px rgba(0,0,0,0.5);
            max-width: 90%;
        }
        .footer {
            position: fixed; bottom: 8px; left: 0; right: 0;
            text-align: center; font-size: 0.6rem; color: #475569;
            z-index: 50; pointer-events: none;
        }
        .footer span { color: #25D366; }
        .color-picker {
            display: flex; gap: 6px; padding: 4px 0;
        }
        .color-picker .color-dot {
            width: 24px; height: 24px; border-radius: 50%;
            border: 2px solid transparent; cursor: pointer;
            transition: 0.15s;
        }
        .color-picker .color-dot.active {
            border-color: #fff; transform: scale(1.1);
        }
        @media (max-width: 480px) {
            .loginCard { padding: 24px 16px; }
            .loginCard h1 { font-size: 1.5rem; }
            #inputArea button { padding: 10px 14px; font-size: 0.8rem; }
            #header .room-code { font-size: 0.75rem; }
            .msg { max-width: 90%; font-size: 0.85rem; }
            #messages { padding: 12px 12px 20px; }
            #inputArea { padding: 10px 12px 20px; }
        }
    </style>
</head>
<body>

    <div id="loginOverlay">
        <div class="loginCard">
            <div class="logo">💬</div>
            <h1>گپ خصوصی</h1>
            <div class="sub">با کد اتاق وارد شو</div>
            <input id="roomInput" placeholder="کد اتاق (مثلاً ABC123)" value="FAMILY2025">
            <input id="nameInput" placeholder="نام شما...">
            <div id="savedUserBox" class="saved-user" style="display:none;">
                👤 <strong id="savedUserName"></strong>
            </div>
            <button class="btn-primary" id="joinBtn">🚀 ورود به چت</button>
            <button class="logout-btn" id="logoutBtn">🚪 خروج از حساب</button>
        </div>
    </div>

    <div id="chatContainer">
        <div id="header">
            <div><span class="room-code" id="roomDisplay">📌 FAMILY2025</span></div>
            <div style="display:flex;align-items:center;gap:10px;">
                <span class="user-name" id="userDisplay">👤 مهمان</span>
                <button class="logout-btn" id="headerLogoutBtn">🚪 خروج</button>
            </div>
        </div>
        <div id="messages"></div>
        <div id="inputArea">
            <div class="input-wrapper">
                <input id="msgInput" placeholder="پیام خود را بنویس..." />
                <button id="sendBtn">📤</button>
            </div>
            <div class="btn-group">
                <button class="btn-secondary" id="voiceBtn" title="پیام صوتی">🎤</button>
                <button class="btn-secondary" id="fileBtn" title="ارسال فایل">📎</button>
                <button class="btn-secondary" id="selfDestructBtn" title="ناپدیدشونده">⏳</button>
            </div>
        </div>
    </div>

    <div class="footer">
        ساخته شده توسط <span>mohammed</span> · 09169044453
    </div>

    <div id="toast" class="toast"></div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBV_HPvDFrG7npGtDfA8wrk0XRtq4s5c4k",
            authDomain: "location-tracker-e732b.firebaseapp.com",
            projectId: "location-tracker-e732b",
            storageBucket: "location-tracker-e732b.firebasestorage.app",
            messagingSenderId: "425589009128",
            appId: "1:425589009128:web:759e3b6b614434eb75775d"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let roomId = '', userName = '', messagesRef = null;
        let selfDestruct = false;
        let replyTo = null;
        let editMessageId = null;
        let userColor = '#25D366';
        const defaultColors = ['#25D366', '#3b82f6', '#ef4444', '#eab308', '#8b5cf6', '#ec4899', '#14b8a6'];

        const loginOverlay = document.getElementById('loginOverlay');
        const chatContainer = document.getElementById('chatContainer');
        const roomInput = document.getElementById('roomInput');
        const nameInput = document.getElementById('nameInput');
        const joinBtn = document.getElementById('joinBtn');
        const logoutBtn = document.getElementById('logoutBtn');
        const headerLogoutBtn = document.getElementById('headerLogoutBtn');
        const msgInput = document.getElementById('msgInput');
        const sendBtn = document.getElementById('sendBtn');
        const messagesDiv = document.getElementById('messages');
        const roomDisplay = document.getElementById('roomDisplay');
        const userDisplay = document.getElementById('userDisplay');
        const toastEl = document.getElementById('toast');
        const savedUserBox = document.getElementById('savedUserBox');
        const savedUserName = document.getElementById('savedUserName');
        const voiceBtn = document.getElementById('voiceBtn');
        const fileBtn = document.getElementById('fileBtn');
        const selfDestructBtn = document.getElementById('selfDestructBtn');

        function showToast(msg) {
            toastEl.textContent = msg;
            toastEl.style.display = 'block';
            clearTimeout(toastEl._timer);
            toastEl._timer = setTimeout(() => { toastEl.style.display = 'none'; }, 2800);
        }

        function saveUser(name) { localStorage.setItem('chat_username', name); }
        function loadSavedUser() {
            const saved = localStorage.getItem('chat_username');
            if (saved) {
                nameInput.value = saved;
                savedUserName.textContent = saved;
                savedUserBox.style.display = 'block';
                logoutBtn.style.display = 'block';
                return true;
            }
            return false;
        }
        function clearSavedUser() {
            localStorage.removeItem('chat_username');
            nameInput.value = '';
            savedUserBox.style.display = 'none';
            logoutBtn.style.display = 'none';
        }

        function joinChat() {
            const room = roomInput.value.trim().toUpperCase();
            const name = nameInput.value.trim();
            if (!room || room.length < 4) { showToast('❌ کد اتاق حداقل ۴ کاراکتر'); return; }
            if (!name || name.length < 2) { showToast('❌ نام خود را وارد کن'); return; }

            roomId = room; userName = name;
            saveUser(name);
            loginOverlay.style.display = 'none';
            chatContainer.style.display = 'flex';
            roomDisplay.textContent = '📌 ' + roomId;
            userDisplay.textContent = '👤 ' + userName;

            messagesRef = db.ref('chats/' + roomId + '/messages');
            loadMessages();
            showToast('✅ وارد چت شدی');
        }

        function loadMessages() {
            messagesRef.off();
            messagesRef.limitToLast(50).on('child_added', function(snapshot) {
                const data = snapshot.val();
                if (!data) return;
                if (data.selfDestruct && data.selfDestruct > 0) {
                    setTimeout(() => {
                        messagesRef.child(snapshot.key).remove();
                    }, data.selfDestruct * 1000);
                }
                const div = document.createElement('div');
                div.className = 'msg ' + (data.name === userName ? 'me' : 'other');
                if (data.color) {
                    if (data.name === userName) {
                        div.style.background = data.color;
                    } else {
                        div.style.borderColor = data.color;
                    }
                }
                const time = new Date(data.time).toLocaleTimeString('fa-IR', { hour: '2-digit', minute: '2-digit' });
                let html = `<div class="sender">${data.name}</div>`;
                if (data.replyTo) {
                    html += `<div class="reply-to">↩️ پاسخ به: ${data.replyTo}</div>`;
                }
                html += data.text;
                if (data.edited) {
                    html += `<span class="edit-indicator">✏️ ویرایش شده</span>`;
                }
                html += `<div class="time">${time}</div>`;
                if (data.reactions) {
                    html += `<div class="reactions">`;
                    for (const [emoji, count] of Object.entries(data.reactions)) {
                        html += `<span onclick="addReaction('${snapshot.key}', '${emoji}')">${emoji} ${count}</span>`;
                    }
                    html += `</div>`;
                }
                html += `<div class="actions">`;
                if (data.name === userName) {
                    html += `<button onclick="editMessage('${snapshot.key}')">✏️ ویرایش</button>`;
                    html += `<button onclick="deleteForAll('${snapshot.key}')">🗑️ حذف برای همه</button>`;
                }
                html += `<button onclick="replyToMessage('${snapshot.key}', '${data.name}')">↩️ پاسخ</button>`;
                html += `</div>`;
                div.innerHTML = html;
                messagesDiv.appendChild(div);
                messagesDiv.scrollTop = messagesDiv.scrollHeight;
                if (data.name !== userName) {
                    if (Notification.permission === 'granted') {
                        new Notification('پیام جدید از ' + data.name, {
                            body: data.text,
                            icon: '💬'
                        });
                    }
                }
            });
        }

        function sendMessage() {
            const text = msgInput.value.trim();
            if (!text) return;
            if (!roomId || !userName) { showToast('❌ ابتدا وارد چت شو'); return; }
            const msgData = {
                name: userName,
                text: text,
                time: Date.now(),
                color: userColor
            };
            if (selfDestruct) {
                msgData.selfDestruct = 30;
                selfDestruct = false;
                selfDestructBtn.style.background = '#334155';
                showToast('⏳ حالت ناپدیدشونده غیرفعال شد');
            }
            if (replyTo) {
                msgData.replyTo = replyTo;
                replyTo = null;
            }
            if (editMessageId) {
                msgData.edited = true;
                messagesRef.child(editMessageId).update(msgData);
                editMessageId = null;
                sendBtn.textContent = '📤';
                msgInput.placeholder = 'پیام خود را بنویس...';
                showToast('✅ ویرایش شد');
                return;
            }
            messagesRef.push(msgData);
            msgInput.value = '';
            msgInput.focus();
        }

        function addReaction(msgId, emoji) {
            const ref = messagesRef.child(msgId + '/reactions/' + emoji);
            ref.transaction((current) => {
                return (current || 0) + 1;
            });
        }

        function editMessage(msgId) {
            messagesRef.child(msgId).once('value', (snap) => {
                const data = snap.val();
                if (data && data.name === userName) {
                    msgInput.value = data.text;
                    editMessageId = msgId;
                    sendBtn.textContent = '💾 ذخیره';
                    msgInput.placeholder = 'ویرایش پیام...';
                    msgInput.focus();
                    showToast('✏️ در حال ویرایش');
                }
            });
        }

        function deleteForAll(msgId) {
            if (confirm('پیام برای همه حذف شود؟')) {
                messagesRef.child(msgId).update({ text: '⚠️ این پیام حذف شده است', deleted: true });
                showToast('🗑️ حذف شد');
            }
        }

        function replyToMessage(msgId, senderName) {
            replyTo = senderName;
            msgInput.placeholder = 'پاسخ به ' + senderName + '...';
            msgInput.focus();
            showToast('↩️ پاسخ به ' + senderName);
        }

        voiceBtn.addEventListener('click', () => {
            showToast('🎤 پیام صوتی (در حال توسعه...)');
        });

        fileBtn.addEventListener('click', () => {
            showToast('📎 ارسال فایل (در حال توسعه...)');
        });

        selfDestructBtn.addEventListener('click', () => {
            selfDestruct = !selfDestruct;
            selfDestructBtn.style.background = selfDestruct ? '#ef4444' : '#334155';
            showToast(selfDestruct ? '⏳ حالت ناپدیدشونده فعال شد' : '⏳ حالت ناپدیدشونده غیرفعال شد');
        });

        if ('Notification' in window) {
            Notification.requestPermission();
        }

        joinBtn.addEventListener('click', joinChat);
        nameInput.addEventListener('keydown', e => { if (e.key === 'Enter') joinChat(); });
        roomInput.addEventListener('keydown', e => { if (e.key === 'Enter') nameInput.focus(); });
        sendBtn.addEventListener('click', sendMessage);
        msgInput.addEventListener('keydown', e => { if (e.key === 'Enter') sendMessage(); });
        logoutBtn.addEventListener('click', () => { if (messagesRef) messagesRef.off(); messagesDiv.innerHTML = ''; chatContainer.style.display = 'none'; loginOverlay.style.display = 'flex'; clearSavedUser(); showToast('🚪 خارج شدی'); });
        headerLogoutBtn.addEventListener('click', () => { if (messagesRef) messagesRef.off(); messagesDiv.innerHTML = ''; chatContainer.style.display = 'none'; loginOverlay.style.display = 'flex'; clearSavedUser(); showToast('🚪 خارج شدی'); });

        loadSavedUser();
        console.log('💬 گپ خصوصی آماده است!');
        console.log('🔑 کد اتاق: FAMILY2025');
    </script>
</body>
</html>
