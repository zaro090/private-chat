<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>گپ خصوصی</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/vazirmatn@33.0.4/Vazirmatn-font-face.css">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Vazirmatn', sans-serif;
            background: #0f172a;
            color: #f1f5f9;
            height: 100vh;
            overflow: hidden;
        }
        #loginOverlay {
            position: fixed; inset: 0; z-index: 1000;
            display: flex; justify-content: center; align-items: center;
            background: rgba(15,23,42,0.96); backdrop-filter: blur(20px);
            padding: 20px;
        }
        .loginCard {
            background: #1e293b; border-radius: 28px; padding: 36px 28px;
            max-width: 400px; width: 100%; border: 1px solid #2d3a4a;
            text-align: center; box-shadow: 0 30px 80px rgba(0,0,0,0.6);
        }
        .loginCard .logo { font-size: 3rem; margin-bottom: 10px; }
        .loginCard h1 { color: #3b82f6; font-size: 1.8rem; font-weight: 800; }
        .loginCard .sub { color: #94a3b8; font-size: 0.85rem; margin: 6px 0 20px; }
        .loginCard input {
            width: 100%; padding: 14px 16px; border-radius: 14px;
            border: 1px solid #334155; background: #0f172a; color: #f1f5f9;
            font-size: 1rem; font-family: inherit; margin-bottom: 12px;
            text-align: center; outline: none; transition: 0.2s;
        }
        .loginCard input:focus { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,0.15); }
        .loginCard .btn-primary {
            width: 100%; padding: 14px;
            background: #3b82f6; color: #fff; border: none;
            border-radius: 50px; font-size: 1rem; font-weight: 800;
            cursor: pointer; transition: 0.15s; font-family: inherit;
            box-shadow: 0 6px 20px rgba(59,130,246,0.3);
        }
        .loginCard .btn-primary:active { transform: scale(0.96); }
        .loginCard .saved-user { color: #94a3b8; font-size: 0.85rem; margin: 12px 0; }
        .loginCard .saved-user strong { color: #3b82f6; }
        .loginCard .logout-btn {
            background: transparent; border: 1px solid #ef4444; color: #ef4444;
            padding: 6px 16px; border-radius: 30px; font-size: 0.8rem;
            cursor: pointer; font-family: inherit; margin-top: 6px; display: none;
        }
        .loginCard .logout-btn:hover { background: #ef4444; color: #fff; }
        #chatContainer {
            display: none; height: 100vh; flex-direction: column;
            padding-bottom: env(safe-area-inset-bottom);
        }
        #header {
            background: #1e293b; padding: 14px 18px;
            border-bottom: 1px solid #2d3a4a;
            display: flex; justify-content: space-between; align-items: center;
            flex-wrap: wrap; gap: 6px;
        }
        #header .room-code { color: #3b82f6; font-size: 0.9rem; font-weight: 700; }
        #header .user-name { color: #94a3b8; font-size: 0.8rem; }
        #header .logout-btn {
            background: transparent; border: 1px solid #ef4444; color: #ef4444;
            padding: 4px 12px; border-radius: 20px; font-size: 0.7rem;
            cursor: pointer; font-family: inherit;
        }
        #messages {
            flex: 1; overflow-y: auto; padding: 16px 16px 20px;
            display: flex; flex-direction: column; gap: 8px;
            background: #0f172a;
        }
        .msg {
            max-width: 78%; padding: 10px 14px; border-radius: 18px;
            word-wrap: break-word; font-size: 0.9rem; line-height: 1.6;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }
        .msg.me {
            align-self: flex-end;
            background: #3b82f6; color: #fff;
            border-bottom-right-radius: 4px;
        }
        .msg.other {
            align-self: flex-start;
            background: #1e293b; border: 1px solid #2d3a4a;
            border-bottom-left-radius: 4px;
        }
        .msg .sender {
            font-size: 0.7rem; font-weight: 600;
            color: #94a3b8; margin-bottom: 2px;
        }
        .msg.me .sender { color: #bfdbfe; }
        .msg .time {
            font-size: 0.6rem; color: #64748b;
            margin-top: 4px; text-align: left;
        }
        .msg.me .time { color: #bfdbfe; opacity: 0.8; }
        #inputArea {
            display: flex; gap: 10px;
            padding: 12px 16px 20px;
            background: #1e293b;
            border-top: 1px solid #2d3a4a;
            padding-bottom: max(20px, env(safe-area-inset-bottom));
        }
        #inputArea input {
            flex: 1; padding: 12px 18px; border-radius: 50px;
            border: 1px solid #334155; background: #0f172a; color: #f1f5f9;
            font-size: 0.95rem; font-family: inherit; outline: none;
        }
        #inputArea input:focus { border-color: #3b82f6; }
        #inputArea button {
            padding: 12px 22px; border-radius: 50px;
            background: #3b82f6; color: #fff; border: none;
            font-weight: 800; cursor: pointer; font-family: inherit;
            transition: 0.15s;
        }
        #inputArea button:active { transform: scale(0.94); }
        .toast {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            background: #1e293b; color: #3b82f6; padding: 10px 22px;
            border-radius: 30px; font-size: 0.8rem; z-index: 999;
            display: none; border: 1px solid #3b82f6; backdrop-filter: blur(8px);
            text-align: center; box-shadow: 0 8px 30px rgba(0,0,0,0.5);
            max-width: 90%;
        }
        .footer {
            position: fixed; bottom: 8px; left: 0; right: 0;
            text-align: center; font-size: 0.6rem; color: #475569;
            z-index: 50; pointer-events: none;
        }
        .footer span { color: #3b82f6; }
        @media (max-width: 480px) {
            .loginCard { padding: 24px 16px; }
            .loginCard h1 { font-size: 1.5rem; }
            #inputArea button { padding: 12px 16px; font-size: 0.85rem; }
            #header .room-code { font-size: 0.75rem; }
            .msg { max-width: 90%; font-size: 0.85rem; }
            #messages { padding: 12px 12px 20px; }
            #inputArea { padding: 10px 12px 16px; }
        }
    </style>
</head>
<body>

    <div id="loginOverlay">
        <div class="loginCard">
            <div class="logo">💬</div>
            <h1>گپ خصوصی</h1>
            <div class="sub">با کد اتاق وارد شو</div>
            <input id="roomInput" placeholder="کد اتاق (مثلاً ABC123)" value="FAMILY2025">
            <input id="nameInput" placeholder="نام شما...">
            <div id="savedUserBox" class="saved-user" style="display:none;">
                👤 <strong id="savedUserName"></strong>
            </div>
            <button class="btn-primary" id="joinBtn">🚀 ورود به چت</button>
            <button class="logout-btn" id="logoutBtn">🚪 خروج از حساب</button>
        </div>
    </div>

    <div id="chatContainer">
        <div id="header">
            <div><span class="room-code" id="roomDisplay">📌 FAMILY2025</span></div>
            <div style="display:flex;align-items:center;gap:10px;">
                <span class="user-name" id="userDisplay">👤 مهمان</span>
                <button class="logout-btn" id="headerLogoutBtn">🚪 خروج</button>
            </div>
        </div>
        <div id="messages"></div>
        <div id="inputArea">
            <input id="msgInput" placeholder="پیام خود را بنویس..." />
            <button id="sendBtn">📤 ارسال</button>
        </div>
    </div>

    <div class="footer">
        ساخته شده توسط <span>mohammed</span> · 09169044453
    </div>

    <div id="toast" class="toast"></div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBV_HPvDFrG7npGtDfA8wrk0XRtq4s5c4k",
            authDomain: "location-tracker-e732b.firebaseapp.com",
            projectId: "location-tracker-e732b",
            storageBucket: "location-tracker-e732b.firebasestorage.app",
            messagingSenderId: "425589009128",
            appId: "1:425589009128:web:759e3b6b614434eb75775d"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let roomId = '', userName = '', messagesRef = null;

        const loginOverlay = document.getElementById('loginOverlay');
        const chatContainer = document.getElementById('chatContainer');
        const roomInput = document.getElementById('roomInput');
        const nameInput = document.getElementById('nameInput');
        const joinBtn = document.getElementById('joinBtn');
        const logoutBtn = document.getElementById('logoutBtn');
        const headerLogoutBtn = document.getElementById('headerLogoutBtn');
        const msgInput = document.getElementById('msgInput');
        const sendBtn = document.getElementById('sendBtn');
        const messagesDiv = document.getElementById('messages');
        const roomDisplay = document.getElementById('roomDisplay');
        const userDisplay = document.getElementById('userDisplay');
        const toastEl = document.getElementById('toast');
        const savedUserBox = document.getElementById('savedUserBox');
        const savedUserName = document.getElementById('savedUserName');

        function showToast(msg) {
            toastEl.textContent = msg;
            toastEl.style.display = 'block';
            clearTimeout(toastEl._timer);
            toastEl._timer = setTimeout(() => { toastEl.style.display = 'none'; }, 2800);
        }

        function saveUser(name) { localStorage.setItem('chat_username', name); }
        function loadSavedUser() {
            const saved = localStorage.getItem('chat_username');
            if (saved) {
                nameInput.value = saved;
                savedUserName.textContent = saved;
                savedUserBox.style.display = 'block';
                logoutBtn.style.display = 'block';
                return true;
            }
            return false;
        }
        function clearSavedUser() {
            localStorage.removeItem('chat_username');
            nameInput.value = '';
            savedUserBox.style.display = 'none';
            logoutBtn.style.display = 'none';
        }

        function joinChat() {
            const room = roomInput.value.trim().toUpperCase();
            const name = nameInput.value.trim();
            if (!room || room.length < 4) { showToast('❌ کد اتاق حداقل ۴ کاراکتر'); return; }
            if (!name || name.length < 2) { showToast('❌ نام خود را وارد کن'); return; }

            roomId = room; userName = name;
            saveUser(name);
            loginOverlay.style.display = 'none';
            chatContainer.style.display = 'flex';
            roomDisplay.textContent = '📌 ' + roomId;
            userDisplay.textContent = '👤 ' + userName;

            messagesRef = db.ref('chats/' + roomId + '/messages');
            loadMessages();
            showToast('✅ وارد چت شدی');
        }

        function loadMessages() {
            messagesRef.off();
            messagesRef.limitToLast(50).on('child_added', function(snapshot) {
                const data = snapshot.val();
                if (!data) return;
                const div = document.createElement('div');
                div.className = 'msg ' + (data.name === userName ? 'me' : 'other');
                const time = new Date(data.time).toLocaleTimeString('fa-IR', { hour: '2-digit', minute: '2-digit' });
                div.innerHTML = `<div class="sender">${data.name}</div>${data.text}<div class="time">${time}</div>`;
                messagesDiv.appendChild(div);
                messagesDiv.scrollTop = messagesDiv.scrollHeight;
            });
        }

        function sendMessage() {
            const text = msgInput.value.trim();
            if (!text) return;
            if (!roomId || !userName) { showToast('❌ ابتدا وارد چت شو'); return; }
            messagesRef.push({ name: userName, text: text, time: Date.now() });
            msgInput.value = '';
            msgInput.focus();
        }

        function logout() {
            if (messagesRef) messagesRef.off();
            messagesDiv.innerHTML = '';
            chatContainer.style.display = 'none';
            loginOverlay.style.display = 'flex';
            clearSavedUser();
            showToast('🚪 خارج شدی');
        }

        joinBtn.addEventListener('click', joinChat);
        nameInput.addEventListener('keydown', e => { if (e.key === 'Enter') joinChat(); });
        roomInput.addEventListener('keydown', e => { if (e.key === 'Enter') nameInput.focus(); });
        sendBtn.addEventListener('click', sendMessage);
        msgInput.addEventListener('keydown', e => { if (e.key === 'Enter') sendMessage(); });
        logoutBtn.addEventListener('click', logout);
        headerLogoutBtn.addEventListener('click', logout);
        loadSavedUser();

        console.log('💬 گپ خصوصی آماده است!');
        console.log('🔑 کد اتاق: FAMILY2025');
    </script>
</body>
</html>
